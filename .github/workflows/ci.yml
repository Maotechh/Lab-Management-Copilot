name: CI

on:
  push:
    branches: [ master, main, codex/dsh-lab-delivery ]
  pull_request:
    branches: [ master, main, codex/dsh-lab-delivery ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24.22.2"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Verify browser bundle
      run: |
        npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
        npm run build --prefix frontend
        git diff --exit-code -- consumable_assistant/static/dsh/markdown.js consumable_assistant/static/dsh/THIRD-PARTY-LICENSES.txt

    - name: Install LibreOffice (for .xls parsing)
      run: |
        sudo apt-get update
        sudo apt-get install -y libreoffice
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Lint with Ruff
      run: |
        ruff check consumable_assistant scripts tests
        
    - name: Run Smoke Test
      run: |
        python scripts/smoke_test.py

    - name: Run workflow tests
      env:
        GENAI_API_KEY: ""
        GENAI_REQUIRED: "0"
        CONSUMABLE_AUTO_SEED: "0"
      run: python -m pytest -q tests

    - name: Check JavaScript and installer syntax
      run: |
        set -euo pipefail
        while IFS= read -r -d '' file; do node --check "$file"; done < <(find consumable_assistant/static -name '*.js' -print0)
        node scripts/check_notification_worker.cjs
        for file in deploy/*.sh; do bash -n "$file"; done

  publish-deployment:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dsh-lab-delivery'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Publish immutable deployment authorization
      env:
        DEPLOY_COMMIT: ${{ github.sha }}
        DEPLOY_BRANCH: codex/dsh-lab-delivery
        DEPLOY_REPOSITORY: ${{ github.repository }}
        DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash deploy/publish-ci-release.sh
