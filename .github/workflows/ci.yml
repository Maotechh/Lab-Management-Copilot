name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install LibreOffice (for .xls parsing)
      run: |
        sudo apt-get update
        sudo apt-get install -y libreoffice
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Lint with Ruff
      run: |
        ruff check consumable_assistant scripts tests
        
    - name: Run Smoke Test
      run: |
        python scripts/smoke_test.py

    - name: Run workflow tests
      env:
        GENAI_API_KEY: ""
        GENAI_REQUIRED: "0"
        CONSUMABLE_AUTO_SEED: "0"
      run: python -m pytest -q tests

    - name: Check JavaScript and installer syntax
      run: |
        node --check consumable_assistant/static/app.js
        node --check consumable_assistant/static/operations.js
        node --check consumable_assistant/static/sw.js
        bash -n deploy/install.sh
