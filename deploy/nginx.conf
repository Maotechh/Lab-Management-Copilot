server {
    listen 10.15.21.115:80;
    server_name 10.15.21.115;
    server_tokens off;
    root /var/www/lab-management-trust;

    location = / { try_files /index.html =404; }
    location = /lab-root-ca.crt { default_type application/x-x509-ca-cert; }
    location / { return 308 https://10.15.21.115$request_uri; }
}

server {
    listen 10.15.21.115:443 ssl;
    server_name 10.15.21.115;
    server_tokens off;
    client_max_body_size 161m;
    ssl_certificate /etc/lab-management-tls/server.crt;
    ssl_certificate_key /etc/lab-management-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LabTLS:1m;

    include /etc/nginx/snippets/lab-management-auth.conf;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /api/internal/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 330s;
        proxy_buffering off;
    }
}
