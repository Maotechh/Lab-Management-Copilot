location = /device-validation {
    return 308 /device-validation/;
}

location ^~ /device-validation/api/internal/ { return 404; }
location = /device-validation/sw.js { return 404; }
location = /device-validation/static/manifest.webmanifest { return 404; }
location ^~ /device-validation/api/notifications/ { return 404; }

location ^~ /device-validation/ {
    proxy_pass http://127.0.0.1:8002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 330s;
    proxy_buffering off;

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript text/css application/json;
    sub_filter '/api/' '/device-validation/api/';
    sub_filter '/static/' '/device-validation/static/';
    sub_filter '<link rel="manifest" href="/static/manifest.webmanifest">' '';
    sub_filter 'localStorage.' 'window.labValidationStorage.';
    sub_filter '</head>' '<script>window.labValidationStorage={getItem:key=>localStorage.getItem("device-validation:"+key),setItem:(key,value)=>localStorage.setItem("device-validation:"+key,value),removeItem:key=>localStorage.removeItem("device-validation:"+key)};</script></head>';
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "connect-src https://10.15.21.115/device-validation/; form-action https://10.15.21.115/device-validation/; worker-src 'none'; manifest-src 'none'" always;
}
